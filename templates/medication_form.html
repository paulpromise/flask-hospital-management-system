
{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Add Medication</h1>
        <p>Enter the medication and its inventory details.</p>
    </div>
</div>

<div class="form-panel">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label for="name">Medication Name *</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    value="{{ request.form.get('name', '') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="strength">Strength</label>
                <input
                    type="text"
                    id="strength"
                    name="strength"
                    placeholder="e.g. 500 mg"
                    value="{{ request.form.get('strength', '') }}"
                >
            </div>

            <div class="form-group">
                <label for="dosage_form">Dosage Form</label>
                <select id="dosage_form" name="dosage_form">
                    <option value="">Select dosage form</option>
                    {% for form in ['Tablet', 'Capsule', 'Syrup', 'Injection', 'Cream', 'Ointment', 'Drops', 'Inhaler', 'Other'] %}
                    <option
                        value="{{ form }}"
                        {% if request.form.get('dosage_form') == form %}selected{% endif %}
                    >
                        {{ form }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="stock_quantity">Stock Quantity *</label>
                <input
                    type="number"
                    id="stock_quantity"
                    name="stock_quantity"
                    min="0"
                    value="{{ request.form.get('stock_quantity', '0') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="reorder_level">Reorder Level *</label>
                <input
                    type="number"
                    id="reorder_level"
                    name="reorder_level"
                    min="0"
                    value="{{ request.form.get('reorder_level', '10') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="unit_price">Unit Price *</label>
                <input
                    type="number"
                    id="unit_price"
                    name="unit_price"
                    min="0"
                    step="0.01"
                    value="{{ request.form.get('unit_price', '0.00') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="expiry_date">Expiry Date</label>
                <input
                    type="date"
                    id="expiry_date"
                    name="expiry_date"
                    value="{{ request.form.get('expiry_date', '') }}"
                >
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('medications') }}" class="button button-secondary">
                Cancel
            </a>

            <button type="submit" class="button button-primary">
                Save Medication
            </button>
        </div>
    </form>
</div>
{% endblock %}
